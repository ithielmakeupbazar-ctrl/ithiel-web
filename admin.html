  <title>ITHIEL · Administración</title>
  <style>
:root {
  --focus: #ff9fc2;
  --shadow-sm: 0 8px 24px rgba(74, 17, 43, .09);
  --shadow-md: 0 18px 44px rgba(74, 17, 43, .16);
  --ease-out: cubic-bezier(.22, 1, .36, 1);
}

html { color-scheme: light; }
body { -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
button, a, input, textarea, select { font: inherit; }
button, a { -webkit-tap-highlight-color: transparent; }
button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible {
  outline: 3px solid var(--focus);
  outline-offset: 3px;
}
[hidden] { display: none !important; }

@keyframes page-in {
  from { opacity: 0; transform: translateY(18px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes item-in {
  from { opacity: 0; transform: translateY(22px) scale(.98); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}
@keyframes cart-pop {
  0%, 100% { transform: scale(1); }
  45% { transform: scale(1.22); }
}
.is-cart-pop { animation: cart-pop .38s var(--ease-out); }
.message { font-weight: 650; }
.message.is-error, .notice.is-error { color: #a25119 !important; }
.message.is-success, .notice.is-success { color: #16804b !important; }
.message.is-muted, .notice.is-muted { color: #765763 !important; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    scroll-behavior: auto !important;
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .01ms !important;
  }
}

</style>
  <style>
    :root { --wine:#9d0c48; --pink:#ee5d95; --ink:#261822; --paper:#fff8fb; --line:#ecd9e2; --muted:#725d68; --ok:#16754b; --warn:#a54619; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; color:var(--ink); background:#f8f1f4; }
    button,input { font:inherit; }
    button { cursor:pointer; }
    .hidden { display:none !important; }
    .login { min-height:100vh; display:grid; place-items:center; padding:24px; background:radial-gradient(circle at top,#f19ab9 0,#b40a51 42%,#621033 100%); }
    .login-card { width:min(100%,420px); padding:34px; border-radius:22px; background:#fffafd; box-shadow:0 22px 60px #3e0a264d; }
    .login-back { display:inline-flex; align-items:center; margin-bottom:22px; padding:7px 10px; border:1px solid #d9bdcb; border-radius:999px; color:var(--wine); background:#fff8fb; font-size:13px; font-weight:700; text-decoration:none; }
    .login-back:hover { background:#f8e4ec; }
    .brand { font-weight:700; letter-spacing:.12em; font-size:28px; color:var(--wine); text-align:center; }
    .subtitle { text-align:center; margin:8px 0 26px; color:var(--muted); font-size:14px; }
    label { display:grid; gap:6px; font-size:14px; font-weight:600; margin:14px 0; }
    input { width:100%; padding:12px 13px; border:1px solid #d9bdcb; border-radius:10px; background:white; }
    input:focus { outline:3px solid #ffc8dc; border-color:var(--pink); }
    .primary,.google,.nav button { border:0; border-radius:10px; padding:12px 14px; font-weight:600; }
    .primary { width:100%; background:var(--wine); color:white; margin-top:8px; }
    .google { display:flex; width:100%; align-items:center; justify-content:center; gap:9px; margin-top:12px; background:white; border:1px solid #d5c7ce; color:#33242b; }
    .notice { min-height:20px; margin:14px 0 0; font-size:14px; text-align:center; color:var(--warn); }
    .app { min-height:100vh; }
    header { display:flex; align-items:center; justify-content:space-between; gap:16px; padding:18px clamp(18px,4vw,56px); background:#fff; border-bottom:1px solid var(--line); }
    header .brand { text-align:left; font-size:21px; }
    .account { display:flex; align-items:center; gap:10px; color:var(--muted); font-size:14px; }
    .outline { border:1px solid #d4bec9; color:var(--wine); background:white; border-radius:8px; padding:8px 10px; font-weight:600; }
    .home-link { display:inline-flex; align-items:center; padding:7px 9px; border:1px solid #d9bdcb; border-radius:999px; color:var(--wine); background:#fff8fb; text-decoration:none; font-weight:600; font-size:13px; }
    .home-link:hover { background:#f8e4ec; }
    .google-icon { width:18px; height:18px; flex:0 0 18px; }
    main { max-width:1200px; margin:auto; padding:28px 20px 54px; }
    h1 { font-size:25px; margin:0 0 6px; }
    .lead { margin:0 0 22px; color:var(--muted); }
    .nav { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:24px; }
    .nav button { background:#eadbe2; color:#5e3447; padding:9px 13px; }
    .nav button.active { background:var(--wine); color:white; }
    .cards { display:grid; grid-template-columns:repeat(5,minmax(120px,1fr)); gap:13px; margin:18px 0 26px; }
    .card,.panel { background:white; border:1px solid var(--line); border-radius:14px; box-shadow:0 4px 14px #5d15300b; }
    .card { padding:17px; }
    .card small { color:var(--muted); display:block; }
    .card strong { display:block; margin-top:8px; font-size:28px; color:var(--wine); }
    .panel { padding:20px; overflow:auto; }
    .panel h2 { margin:0 0 15px; font-size:18px; }
    table { width:100%; border-collapse:collapse; font-size:14px; }
    th,td { padding:11px 8px; text-align:left; border-bottom:1px solid #f0e5ea; vertical-align:top; }
    th { color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.04em; }
    th:last-child,td:last-child { position:sticky; right:0; background:#fff; box-shadow:-8px 0 12px #fff; }
    .pill { display:inline-block; padding:4px 8px; border-radius:100px; background:#f4dce6; color:#7c1743; font-size:12px; font-weight:600; }
    .pill.low { background:#ffe4d9; color:#9a3715; }
    .empty { color:var(--muted); padding:20px 0; }
    .customer-form { display:grid; grid-template-columns:1.2fr 1fr auto auto; gap:10px; align-items:end; margin-bottom:22px; }
    .customer-form label { margin:0; }
    .check { display:flex; align-items:center; gap:7px; font-size:13px; font-weight:600; white-space:nowrap; padding-bottom:11px; }
    .check input { width:auto; }
    .customer-form .primary { width:auto; margin:0; white-space:nowrap; }
    .product-form { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; }
    .product-form .wide { grid-column:1 / -1; }
    textarea,select { width:100%; padding:12px 13px; border:1px solid #d9bdcb; border-radius:10px; background:white; font:inherit; }
    textarea:focus,select:focus { outline:3px solid #ffc8dc; border-color:var(--pink); }
    .actions { display:flex; gap:10px; flex-wrap:wrap; margin:0 0 17px; }
    .actions .primary { width:auto; margin:0; }
    .product-search { max-width:500px; margin:0 0 16px; }
    .photo-thumb { width:42px; height:42px; object-fit:cover; border-radius:7px; background:#f2e7eb; vertical-align:middle; }
    .product-photos { display:flex; flex-wrap:wrap; gap:10px; margin:4px 0 8px; }
    .product-photo { display:grid; gap:4px; justify-items:center; color:var(--muted); font-size:11px; }
    .product-photo img { width:76px; height:76px; object-fit:cover; border-radius:9px; background:#f2e7eb; }
    .edit { border:1px solid #d4bec9; color:var(--wine); background:white; border-radius:7px; padding:6px 8px; font-weight:600; font-size:12px; }
    .delete { color:#a12835; border-color:#e9c2c7; margin-left:5px; }
    .delete:hover { color:#fff; background:#a12835; border-color:#a12835; }
    .coupon-form { display:grid; grid-template-columns:repeat(4,minmax(140px,1fr)); gap:12px; align-items:end; margin:0 0 8px; padding:18px; border:1px solid var(--line); border-radius:14px; background:var(--paper); }
    .coupon-form label { margin:0; }
    .coupon-form .coupon-active { align-self:center; padding:12px 0 0; }
    .coupon-form-actions { display:flex; gap:8px; grid-column:1 / -1; }
    .coupon-form-actions .primary { width:auto; margin:0; }
    .coupon-table { margin-top:22px; }
    @media (max-width:820px) { .customer-form,.product-form,.coupon-form { grid-template-columns:1fr; } .check { padding:0; } }
    @media (max-width:820px) { .cards { grid-template-columns:repeat(2,1fr); } .account span { display:none; } }
    .login-card { animation:page-in .6s var(--ease-out) both; box-shadow:var(--shadow-md); }
    header { position:sticky; top:0; z-index:5; backdrop-filter:blur(14px); background:rgba(255,255,255,.92); }
    button,.home-link,input,textarea,select,.card { transition:transform .22s var(--ease-out),box-shadow .22s,border-color .22s,background-color .22s; }
    button:hover,.home-link:hover { transform:translateY(-2px); box-shadow:var(--shadow-sm); }
    button:active { transform:scale(.97); }
    .card:hover { transform:translateY(-4px); box-shadow:var(--shadow-sm); }
    .nav { position:sticky; top:76px; z-index:4; padding:8px; border:1px solid var(--line); border-radius:14px; background:rgba(248,241,244,.9); backdrop-filter:blur(12px); }
    .panel { box-shadow:var(--shadow-sm); }
    .section-spaced { margin-top:26px; }
    input:focus,textarea:focus,select:focus { outline:none; box-shadow:0 0 0 4px rgba(238,93,149,.13); }
    @media(max-width:820px){header{align-items:flex-start}.account{flex-wrap:wrap;justify-content:flex-end}.nav{top:82px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}.nav button{flex:0 0 auto}.panel{padding:14px}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
    @media(max-width:480px){main{padding-inline:12px}.cards{grid-template-columns:1fr}.login-card{padding:25px}}

</style>

      <p id="loginNotice" class="notice" aria-live="polite"></p>
    </form>
  </section>

  <section id="appView" class="app hidden">
    <header class="admin-top">
      <div class="brand">ITHIEL</div>
      <div class="account"><span id="accountEmail"></span><a class="home-link" href="/">Catálogo</a><button id="logout" class="outline">Salir</button></div>
    </header>
    <section class="admin-hero">
      <h1>Administración</h1>

      </section><div class="admin-nav-strip"><nav class="nav" aria-label="Secciones del panel">
        <button data-view="dashboard" class="active">Resumen</button><button data-view="orders">Pedidos</button><button data-view="products">Administrar productos</button><button data-view="catalog">Categorías</button><button data-view="customers">Clientes</button><button data-view="coupons">Cupones</button><button data-view="experiences">Experiencias</button><button data-view="history">Historial</button><button data-view="admins">Administradores</button><button data-view="account">Mi cuenta</button>
      </nav></div><main class="admin-shell"><div id="content"><p class="empty">Cargando…</p></div></main>
    <footer class="admin-footer">ITHIEL Bazar y Makeup · Derechos reservados 2015 - 2026 · Rosario, Santa Fe</footer>
  </section>
  <script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

    const SUPABASE_URL = "https://bfuexiblfuqwykktltrp.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_8-do7RGW8-li-7d1BnAsXQ_RYsks6iy";
    const ADMIN_API = `${SUPABASE_URL}/functions/v1/admin-api-v2`;
    const loginView = document.querySelector("#loginView");
    const appView = document.querySelector("#appView");
    const notice = document.querySelector("#loginNotice");
    const content = document.querySelector("#content");
    let supabase;
    let currentView = sessionStorage.getItem("ithiel-admin-view") || "dashboard";
    let pendingViewState = null;
    let appReady = false;

    function money(value) { return value === null || value === undefined || value === "" ? "—" : `$${Number(value).toLocaleString("es-AR")}`; }
    function escapeHtml(value) { return String(value ?? "").replace(/[&<>'\"]/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;","\"":"&quot;"}[c])); }
    function downloadCsv(filename, headers, rows) { const quote=value=>`"${String(value ?? "").replaceAll('"','""')}"`; const blob=new Blob([[headers,...rows].map(row=>row.map(quote).join(",")).join("\n")],{type:"text/csv;charset=utf-8"}); const link=document.createElement("a"); link.href=URL.createObjectURL(blob); link.download=filename; link.click(); setTimeout(()=>URL.revokeObjectURL(link.href),500); }
    function byName(a, b) { return String(a?.name ?? a).localeCompare(String(b?.name ?? b), "es-AR", { sensitivity:"base" }); }
    function statusLabel(status) {
      const label = ({ published:"Publicado", draft:"Borrador", archived:"Archivado", pending:"Pendiente", processing:"En proceso", completed:"Completado", cancelled:"Cancelado" })[status] || escapeHtml(status);
      return `<span class="status-pill" data-status="${escapeHtml(status)}"><span class="status-dot" aria-hidden="true"></span><span>${label}</span></span>`;
    }
    function setNotice(message = "") { notice.textContent = message; }
    function setLoading() { content.innerHTML = '<p class="empty">Cargando…</p>'; }
    function showProductError(error) { content.innerHTML = `<p class="empty">${escapeHtml(error?.message || "No se pudo abrir el producto.")}</p>`; }
    function viewHead(label, title, copy, action = "") { return `<section class="view-head"><div><span class="eyebrow">${label}</span><h2>${title}</h2><p>${copy}</p></div>${action}</section>`; }
    const icons = {
      edit:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4l11-11-4-4L4 16v4Z"></path></svg>',
      pause:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14M16 5v14"></path></svg>',
      play:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 5 11 7-11 7V5Z"></path></svg>',
      trash:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M7 7l1 13h8l1-13"></path></svg>'
    };

    async function callAdmin(action, payload = {}) {
      const { data: { session } } = await supabase.auth.getSession();
      if (!session) throw new Error("Tu sesión venció. Volvé a ingresar.");
      const response = await fetch(ADMIN_API, {
        method: "POST",
        headers: { "Content-Type":"application/json", apikey:SUPABASE_ANON_KEY, Authorization:`Bearer ${session.access_token}` },
        body: JSON.stringify({ action, ...payload }),
      });
      const result = await response.json();
      if (!response.ok) throw new Error(result.error || "No se pudo cargar la información.");
      return result.data;
    }

    function renderDashboard(data) {
      const t = data.totals;
      content.innerHTML = `${viewHead("RESUMEN", "Administración", "Vista general del negocio.")}
        <div class="cards">
          <button class="card dashboard-link" type="button" data-go-view="products"><small>Productos</small><strong>${t.products}</strong></button>
          <button class="card dashboard-link" type="button" data-go-view="products" data-go-stock="low"><small>Stock para revisar</small><strong>${t.lowStock}</strong></button>
          <button class="card dashboard-link" type="button" data-go-view="products" data-go-images="missing"><small>Productos sin foto</small><strong>${t.productsWithoutImages || 0}</strong></button>
          <button class="card dashboard-link" type="button" data-go-view="orders" data-go-status="pending"><small>Pedidos pendientes</small><strong>${t.pendingOrders}</strong></button>
          <button class="card dashboard-link" type="button" data-go-view="coupons"><small>Cupones activos</small><strong>${t.activeCoupons}</strong></button>
          <article class="card"><small>Ventas · 30 días</small><strong>${money(t.revenue30Days || 0)}</strong><small>${t.orders30Days || 0} pedidos · ticket ${money(t.averageOrder30Days || 0)}</small></article>
        </div>
        <div class="dashboard-grid">
          <section class="panel"><h2>Productos para revisar</h2>
            ${data.alerts.length ? `<table><thead><tr><th>Producto</th><th>SKU</th><th>Referencia</th><th>Estado</th></tr></thead><tbody>${data.alerts.slice(0,6).map(p => `<tr><td>${escapeHtml(p.name)}</td><td>${escapeHtml(p.sku)}</td><td><span class="pill low">${p.stock}</span></td><td>${statusLabel(p.status)}</td></tr>`).join("")}</tbody></table>` : '<p class="empty">No hay productos para revisar.</p>'}
          </section>
          <section class="panel"><h2>Actividad de pedidos</h2><table><tbody><tr><td>Pendientes</td><td><span class="pill">${t.pendingOrders}</span></td></tr><tr><td>En proceso</td><td><span class="pill">${t.processingOrders}</span></td></tr><tr><td>Cupones activos</td><td><span class="pill">${t.activeCoupons}</span></td></tr><tr><td>Vencen en 7 días</td><td><span class="pill ${t.expiringCoupons ? "low" : ""}">${t.expiringCoupons || 0}</span></td></tr></tbody></table></section>
          <section class="panel"><h2>Más vendidos · 30 días</h2>${data.bestSellers?.length ? `<table><thead><tr><th>Producto</th><th>Unidades</th><th>Ventas</th></tr></thead><tbody>${data.bestSellers.map(item=>`<tr><td>${escapeHtml(item.name)}</td><td>${item.quantity}</td><td>${money(item.revenue)}</td></tr>`).join("")}</tbody></table>` : '<p class="empty">Todavía no hay ventas en este período.</p>'}</section>
        </div>`;
      document.querySelectorAll("[data-go-view]").forEach(button => button.addEventListener("click", () => {
        pendingViewState = button.dataset.goView === "products" ? { stockFilter:button.dataset.goStock || "", imageFilter:button.dataset.goImages || "" } : button.dataset.goView === "orders" ? { status:button.dataset.goStatus || "" } : null;
        loadView(button.dataset.goView);
      }));
    }

    async function renderProductForm(product = null) {
      const options = await callAdmin("catalogOptions");
      const categoryOptions = ['<option value="">Elegir categoría</option>', ...options.categories.map(c => `<option value="${c.id}" ${product?.category_id === c.id ? "selected" : ""}>${escapeHtml(c.name)}</option>`)].join("");
      const inferredSupplier = product?.supplier_price ?? (product?.retail_price ? Math.round(Number(product.retail_price) / 1.8) : "");
      const variantRow = (variant = {}) => `<div class="variant-row" data-variant-row>
        <input type="hidden" data-variant-id value="${escapeHtml(variant.id || "")}">
        <input type="hidden" data-variant-sku value="${escapeHtml(variant.sku || "")}">
        <input type="hidden" data-variant-image value="${escapeHtml(variant.image_url || variant.imageUrl || "")}">
        <label>Color / opción<input data-variant-color maxlength="80" value="${escapeHtml(variant.color || "")}" placeholder="Ej.: Rosa"></label>
        <label>Talle<input data-variant-size maxlength="40" value="${escapeHtml(variant.size || "")}" placeholder="Ej.: M"></label>
        <label>Stock<input data-variant-stock type="number" min="0" value="${Number(variant.stock ?? 0)}"></label>
        <label class="check variant-active"><input data-variant-active type="checkbox" ${variant.active === false ? "" : "checked"}> Disponible</label>
        <button class="icon-action delete" type="button" data-remove-variant aria-label="Quitar variante">${icons.trash}</button>
      </div>`;
      const existingVariants = product?.product_variants || [];
      content.innerHTML = `<div class="product-form-modal"><section class="product-form-card">
        <header class="form-top"><div><span class="eyebrow">${product ? "EDITAR PRODUCTO" : "NUEVO PRODUCTO"}</span><h2>${product ? "Editar producto" : "Agregar producto"}</h2></div><button id="backProducts" class="icon-action" type="button" aria-label="Cerrar">×</button></header>
        <form id="productForm" class="product-form">
          <label class="wide upload-field">Imágenes del producto<input id="productPhoto" type="file" accept="image/jpeg,image/png,image/webp" multiple><small>Hasta 8 archivos JPG, PNG o WEBP de 4 MB cada uno.</small><span id="photoSelection" class="photo-selection" aria-live="polite"></span><span id="photoPreview" class="photo-preview"></span></label>
          <label class="span-2">Nombre del producto<input id="productName" required maxlength="180" value="${escapeHtml(product?.name || "")}"></label>
          <label>Código / SKU<input value="${escapeHtml(product?.sku || "Se genera automáticamente")}" readonly></label>
          <label class="wide compact-description">Descripción<textarea id="productDescription" rows="2" maxlength="1500">${escapeHtml(product?.description || "")}</textarea></label>
          <label>Categoría<select id="productCategory" required>${categoryOptions}</select></label>
          <label>Subcategoría<select id="productSubcategory"><option value="">Sin subcategoría</option></select></label>
          <label>Stock<input id="productStock" type="number" min="0" required value="${product?.stock ?? 30}"><small>Con variantes, se usa la suma de sus stocks.</small></label>
          <label>Precio proveedor · interno<input id="productSupplier" type="number" min="1" value="${inferredSupplier}"><small>Completarlo calcula los otros dos.</small></label>
          <label>Precio minorista<input id="productRetail" type="number" min="1" value="${product?.retail_price || ""}"><small>Editable · sugerido: proveedor + 80%</small></label>
          <label>Precio mayorista<input id="productWholesale" type="number" min="1" value="${product?.wholesale_price || ""}"><small>Editable · sugerido: minorista - 20%</small></label>
          <label>Estado<select id="productStatus"><option value="published" ${product?.status === "published" ? "selected" : ""}>Publicado</option><option value="draft" ${product?.status === "draft" ? "selected" : ""}>Borrador</option><option value="archived" ${product?.status === "archived" ? "selected" : ""}>Oculto</option></select></label>
          <section class="wide variant-editor">
            <div class="variant-editor-head"><div><h3>Variantes</h3><p>Con varias fotos se crean automáticamente. Solo completá el color, opción o talle.</p></div><button id="addVariant" class="outline" type="button">+ Agregar variante</button></div>
            <div id="variantRows" class="variant-rows">${existingVariants.map(variantRow).join("")}</div>
            <p id="noVariants" class="empty compact-empty" ${existingVariants.length ? "hidden" : ""}>Este producto no tiene variantes.</p>
          </section>
          ${product?.product_images?.length ? `<div class="wide"><label>Fotos actuales</label><small>Usá las flechas para elegir el orden de publicación.</small><div class="product-photos">${[...product.product_images].sort((a,b)=>Number(a.position)-Number(b.position)).map((image,index,all) => `<div class="product-photo"><img src="${escapeHtml(image.image_url)}" alt="Vista previa del producto"><div class="actions"><button class="edit" type="button" data-move-image="${image.id}" data-direction="-1" ${index===0?"disabled":""}>←</button><button class="edit" type="button" data-move-image="${image.id}" data-direction="1" ${index===all.length-1?"disabled":""}>→</button><button class="edit delete" type="button" data-delete-image="${image.id}">Quitar</button></div></div>`).join("")}</div></div>` : ""}
          <footer class="wide form-footer"><button id="cancelProduct" class="outline" type="button">Cancelar</button><button class="primary" type="submit">${product ? "Guardar cambios" : "Crear producto"}</button></footer>
        </form><p id="productMessage" class="notice" aria-live="polite"></p>
      </section></div>`;
      const category = document.querySelector("#productCategory");
      const subcategory = document.querySelector("#productSubcategory");
      const supplier = document.querySelector("#productSupplier");
      const retail = document.querySelector("#productRetail");
      const wholesale = document.querySelector("#productWholesale");
      const photoInput = document.querySelector("#productPhoto");
      const photoSelection = document.querySelector("#photoSelection");
      const photoPreview = document.querySelector("#photoPreview");
      const calculatePrices = () => { const cost=Number(supplier.value)||0; const retailValue=cost?Math.ceil((cost*1.8)/500)*500:0; retail.value=retailValue||""; wholesale.value=retailValue?Math.round(retailValue*.8):""; };
      const fillSubcategories = () => { const selected=category.value; subcategory.innerHTML='<option value="">Sin subcategoría</option>'+options.subcategories.filter(s=>s.category_id===selected).sort(byName).map(s=>`<option value="${s.id}" ${product?.subcategory_id===s.id?"selected":""}>${escapeHtml(s.name)}</option>`).join(""); };
      supplier.addEventListener("input", calculatePrices);
      const variantRows = document.querySelector("#variantRows");
      const updateVariantEmpty = () => { document.querySelector("#noVariants").hidden = Boolean(variantRows.children.length); };
      document.querySelector("#addVariant").addEventListener("click", () => { variantRows.insertAdjacentHTML("beforeend", variantRow()); updateVariantEmpty(); });
      variantRows.addEventListener("click", (event) => { const button=event.target.closest("[data-remove-variant]"); if (!button) return; button.closest("[data-variant-row]").remove(); updateVariantEmpty(); });
      const existingImages = [...(product?.product_images || [])].sort((a,b) => Number(a.position) - Number(b.position));
      const ensurePhotoVariants = (newPhotoCount) => {
        const totalPhotos = existingImages.length + newPhotoCount;
        if (totalPhotos < 2 || variantRows.children.length) return;
        const totalStock = Math.max(0, Number(document.querySelector("#productStock").value) || 0);
        for (let index = 0; index < totalPhotos; index += 1) {
          const stock = Math.floor(totalStock / totalPhotos) + (index < totalStock % totalPhotos ? 1 : 0);
          variantRows.insertAdjacentHTML("beforeend", variantRow({ color:`Opción ${index + 1}`, stock, image_url:existingImages[index]?.image_url || "" }));
        }
        updateVariantEmpty();
      };
      photoInput.addEventListener("change", () => {
        const files = [...photoInput.files];
        photoSelection.textContent = files.length ? `${files.length} imagen${files.length === 1 ? "" : "es"} seleccionada${files.length === 1 ? "" : "s"}.` : "";
        photoPreview.replaceChildren(...files.map((file) => {
          const image = document.createElement("img");
          image.src = URL.createObjectURL(file);
          image.alt = `Vista previa de ${file.name}`;
          image.onload = () => URL.revokeObjectURL(image.src);
          return image;
        }));
        ensurePhotoVariants(files.length);
      });
      category.addEventListener("change", () => { product={...product,subcategory_id:""}; fillSubcategories(); });
      fillSubcategories();
      document.querySelector("#backProducts").addEventListener("click",()=>loadView("products"));
      document.querySelector("#cancelProduct").addEventListener("click",()=>loadView("products"));
      document.querySelectorAll("[data-delete-image]").forEach(button=>button.addEventListener("click",async()=>{if(!confirm("¿Quitar esta foto del producto?"))return;try{await callAdmin("deleteProductImage",{imageId:button.dataset.deleteImage});product.product_images=(product.product_images||[]).filter(image=>image.id!==button.dataset.deleteImage);await renderProductForm(product)}catch(error){alert(error.message)}}));
      document.querySelectorAll("[data-move-image]").forEach(button=>button.addEventListener("click",async()=>{const images=[...(product?.product_images||[])].sort((a,b)=>Number(a.position)-Number(b.position));const index=images.findIndex(image=>image.id===button.dataset.moveImage);const target=index+Number(button.dataset.direction);if(index<0||target<0||target>=images.length)return;[images[index],images[target]]=[images[target],images[index]];try{await callAdmin("reorderProductImages",{productId:product.id,imageIds:images.map(image=>image.id)});product.product_images=images.map((image,position)=>({...image,position:position+1}));await renderProductForm(product)}catch(error){alert(error.message)}}));
      document.querySelector("#productForm").addEventListener("submit",async event=>{
        event.preventDefault();
        const message=document.querySelector("#productMessage");
        message.className="notice is-muted";
        message.textContent="Guardando…";
        try {
          const photos=[...photoInput.files];
          if(photos.length>8)throw new Error("Podés subir hasta 8 imágenes por vez.");
          const oversized=photos.find(file=>file.size>4*1024*1024);
          if(oversized)throw new Error(`La imagen ${oversized.name} supera los 4 MB.`);
          ensurePhotoVariants(photos.length);
          const readVariants=()=>[...document.querySelectorAll("[data-variant-row]")].map(row=>({id:row.querySelector("[data-variant-id]").value,color:row.querySelector("[data-variant-color]").value.trim(),size:row.querySelector("[data-variant-size]").value.trim(),sku:row.querySelector("[data-variant-sku]").value.trim(),imageUrl:row.querySelector("[data-variant-image]").value,stock:row.querySelector("[data-variant-stock]").value,active:row.querySelector("[data-variant-active]").checked}));
          let variants=readVariants();
          if(variants.some(item=>!item.color&&!item.size))throw new Error("Cada variante debe tener color, opción, talle o una combinación.");
          const productPayload={id:product?.id||"",name:document.querySelector("#productName").value,description:document.querySelector("#productDescription").value,categoryId:category.value,subcategoryId:subcategory.value,supplierPrice:supplier.value,retailPrice:retail.value,wholesalePrice:wholesale.value,stock:document.querySelector("#productStock").value,status:document.querySelector("#productStatus").value,variants};
          const result=await callAdmin("saveProduct",productPayload);
          const uploadedUrls=[];
          for(const photo of photos){
            const dataUrl=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=reject;reader.readAsDataURL(photo)});
            const uploaded=await callAdmin("uploadProductImage",{productId:result.id,dataUrl});
            uploadedUrls.push(uploaded.url);
          }
          if(uploadedUrls.length&&variants.length){
            let uploadIndex=0;
            variants=variants.map(variant=>variant.imageUrl?variant:{...variant,imageUrl:uploadedUrls[uploadIndex++]||""});
            await callAdmin("saveProduct",{...productPayload,id:result.id,variants});
          }
          message.className="notice is-success";
          message.textContent=result.created?"Producto creado.":"Producto actualizado.";
          setTimeout(()=>loadView("products"),550);
        } catch(error){message.className="notice is-error";message.textContent=error.message}
      });
    }

    function renderProducts(products) {
      const productList = Array.isArray(products) ? products : products?.products || [];
      const categoryList = Array.isArray(products?.categories) ? products.categories : [];
      const subcategoryList = Array.isArray(products?.subcategories) ? [...products.subcategories].sort(byName) : [];
      const selectedProductIds = new Set();
      const subcategoryOptions = p => `<option value="">Sin subcategoría</option>${subcategoryList.filter(item => item.category_id === p.category_id).map(item => `<option value="${item.id}" ${item.id === p.subcategory_id ? "selected" : ""}>${escapeHtml(item.name)}</option>`).join("")}`;
      const productRow = p => `<tr>
        <td><input class="row-check" type="checkbox" data-select-product="${p.id}" ${selectedProductIds.has(p.id) ? "checked" : ""} aria-label="Seleccionar ${escapeHtml(p.name)}"></td>
        <td>${p.product_images?.[0]?.image_url ? `<img class="photo-thumb" src="${escapeHtml(p.product_images[0].image_url)}" alt="">` : "—"}</td>
        <td><strong>${escapeHtml(p.name)}</strong><br><small>${escapeHtml(p.sku)}</small></td>
        <td><select class="row-select" data-product-category="${p.id}">${categoryList.map(c => `<option value="${c.id}" ${c.id === p.category_id ? "selected" : ""}>${escapeHtml(c.name)}</option>`).join("")}</select></td>
        <td><select class="row-select" data-product-subcategory="${p.id}">${subcategoryOptions(p)}</select></td>
        <td>${money(p.retail_price)}</td>
        <td>${money(p.wholesale_price)}</td>
        <td><span class="pill ${Number(p.stock) <= 5 ? "low" : ""}">${p.stock}</span></td>
        <td>${statusLabel(p.status)}</td>
        <td><div class="actions actions-stack"><button class="icon-action" data-edit-product="${p.id}" title="Editar">${icons.edit}</button><button class="icon-action" data-toggle-product="${p.id}" title="${p.status === "published" ? "Ocultar" : "Publicar"}">${p.status === "published" ? icons.pause : icons.play}</button><button class="icon-action delete" data-delete-product="${p.id}" title="Eliminar">${icons.trash}</button></div></td>
      </tr>`;
      const rows = items => items.length ? `<table class="product-table"><thead><tr><th><input id="selectVisibleProducts" class="row-check" type="checkbox" aria-label="Seleccionar productos visibles"></th><th>Foto</th><th>Producto</th><th>Categoría</th><th>Subcategoría</th><th>Minorista</th><th>Mayorista</th><th>Stock</th><th>Estado</th><th>Acciones</th></tr></thead><tbody>${items.map(productRow).join("")}</tbody></table>` : '<p class="empty">No encontramos productos.</p>';

    function renderCoupons(coupons) {
      const items = Array.isArray(coupons) ? coupons : coupons?.coupons || [];
      const normalizeDate = (value) => value ? new Intl.DateTimeFormat("en-CA", { timeZone:"America/Argentina/Buenos_Aires", year:"numeric", month:"2-digit", day:"2-digit" }).format(new Date(value)) : "";
      const discountLabel = (coupon) => `${Number(coupon.discount_percent || 0)}%`;
      const validity = (coupon) => {
        const start = coupon.starts_at ? new Date(coupon.starts_at).toLocaleDateString("es-AR") : "Ahora";
        const end = coupon.expires_at ? new Date(coupon.expires_at).toLocaleDateString("es-AR") : "Sin vencimiento";
        return `${start} → ${end}`;
      };
      const rows = () => items.length ? `<table><thead><tr><th>Código</th><th>Descuento</th><th>Uso</th><th>Vigencia</th><th>Estado</th><th>Acción</th></tr></thead><tbody>${items.map(coupon => `<tr>
        <td><strong>${escapeHtml(coupon.code)}</strong></td>
        <td>${discountLabel(coupon)}</td>
        <td>${Number(coupon.uses||0)} · ${money(coupon.revenue||0)}</td>
        <td>${escapeHtml(validity(coupon))}</td>
        <td><span class="pill ${coupon.active ? "" : "low"}">${coupon.active ? "Activo" : "Inactivo"}</span></td>
        <td><button class="edit" type="button" data-edit-coupon="${coupon.id}">Editar</button><button class="edit" type="button" data-toggle-coupon="${coupon.id}">${coupon.active ? "Desactivar" : "Activar"}</button><button class="edit delete" type="button" data-delete-coupon="${coupon.id}" title="Eliminar cupón">🗑</button></td>
      </tr>`).join("")}</tbody></table>` : '<p class="empty">Todavía no hay cupones creados.</p>';

      content.innerHTML = `${viewHead("CUPONES","Administrar cupones","Descuentos y vigencia.")}<section class="panel"><h2>Cupones de descuento</h2>
        <p class="lead">Creá códigos porcentuales y definí durante qué período pueden usarse en el carrito.</p>
        <form id="couponForm" class="coupon-form">
          <input id="couponId" type="hidden">
          <label>Código<input id="couponCode" required maxlength="40" autocomplete="off" placeholder="Ej.: BIENVENIDA10"></label>
          <label>Descuento (%)<input id="couponValue" type="number" min="1" max="100" step="1" required placeholder="10"></label>
          <label>Desde<input id="couponStartsAt" type="date" required></label>
          <label>Hasta<input id="couponExpiresAt" type="date" required></label>
          <label class="check coupon-active"><input id="couponActive" type="checkbox" checked> Cupón activo</label>
          <div class="coupon-form-actions"><button class="primary" type="submit">Guardar cupón</button><button id="cancelCouponEdit" class="outline hidden" type="button">Cancelar edición</button></div>
        </form>
        <p id="couponMessage" class="notice" aria-live="polite"></p>
        <div id="couponRows" class="coupon-table">${rows()}</div>
      </section>`;

      const form = document.querySelector("#couponForm");
      const message = document.querySelector("#couponMessage");
      const cancel = document.querySelector("#cancelCouponEdit");
      const resetForm = () => {
        form.reset();
        document.querySelector("#couponId").value = "";
        document.querySelector("#couponActive").checked = true;
        cancel.classList.add("hidden");
        message.textContent = "";
      };
      const editCoupon = (coupon) => {
        document.querySelector("#couponId").value = coupon.id;
        document.querySelector("#couponCode").value = coupon.code || "";
        document.querySelector("#couponValue").value = coupon.discount_percent || "";
        document.querySelector("#couponStartsAt").value = normalizeDate(coupon.starts_at);
        document.querySelector("#couponExpiresAt").value = normalizeDate(coupon.expires_at);
        document.querySelector("#couponActive").checked = Boolean(coupon.active);
        cancel.classList.remove("hidden");
        form.scrollIntoView({ behavior:"smooth", block:"start" });
      };
      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const value = Number(document.querySelector("#couponValue").value);
        const startsAt = document.querySelector("#couponStartsAt").value;
        const expiresAt = document.querySelector("#couponExpiresAt").value;
        if (value > 100) { message.className = "notice is-error"; message.textContent = "El porcentaje no puede superar 100%."; return; }
        if (expiresAt <= startsAt) { message.className = "notice is-error"; message.textContent = "El vencimiento debe ser posterior al inicio."; return; }
        message.className = "notice is-muted"; message.textContent = "Guardando cupón…";
        try {
          await callAdmin("saveCoupon", {
            couponId: document.querySelector("#couponId").value,
            code: document.querySelector("#couponCode").value.trim().toUpperCase(),
            discountPercent: value,
            startsAt,
            expiresAt,
            active: document.querySelector("#couponActive").checked,
          });
          message.className = "notice is-success"; message.textContent = "Cupón guardado.";
          setTimeout(() => loadView("coupons"), 450);
        } catch (error) { message.className = "notice is-error"; message.textContent = error.message; }
      });
      cancel.addEventListener("click", resetForm);
      document.querySelectorAll("[data-edit-coupon]").forEach(button => button.addEventListener("click", () => editCoupon(items.find(coupon => coupon.id === button.dataset.editCoupon))));
      document.querySelectorAll("[data-toggle-coupon]").forEach(button => button.addEventListener("click", async () => {
        const coupon = items.find(item => item.id === button.dataset.toggleCoupon);
        try { await callAdmin("saveCoupon", {
          couponId:coupon.id, code:coupon.code, discountPercent:coupon.discount_percent,
          startsAt:normalizeDate(coupon.starts_at), expiresAt:normalizeDate(coupon.expires_at), active:!coupon.active,
        }); await loadView("coupons"); }
        catch (error) { alert(error.message); }
      }));
      document.querySelectorAll("[data-delete-coupon]").forEach(button => button.addEventListener("click", async () => {
        const coupon = items.find(item => item.id === button.dataset.deleteCoupon);
        if (!confirm(`¿Eliminar definitivamente el cupón “${coupon?.code || ""}”?`)) return;
        try { await callAdmin("deleteCoupon", { couponId:button.dataset.deleteCoupon }); await loadView("coupons"); }
        catch (error) { alert(error.message); }
      }));
    }

    async function loadView(view) {
      currentView = view;
      sessionStorage.setItem("ithiel-admin-view", view);
      document.querySelectorAll(".nav button").forEach(button => button.classList.toggle("active", button.dataset.view === view));
      setLoading();
      try {
        if (view === "account") { await renderAccount(); return; }
        const state = pendingViewState;
        pendingViewState = null;
        const data = await callAdmin(view === "catalog" ? "catalogManagement" : view === "history" ? "auditLog" : view, state || {});
        if (view === "dashboard") renderDashboard(data);
        if (view === "products") renderProductsV2(data, state || {});
        if (view === "orders") {
          renderOrdersV2(data, state || {});
          document.querySelector(".product-tools")?.insertAdjacentHTML("beforeend", '<button id="exportOrders" class="outline" type="button">Exportar CSV</button>');
          document.querySelector("#exportOrders")?.addEventListener("click", () => downloadCsv("ithiel-pedidos.csv", ["Pedido","Fecha","Cliente","Contacto","Seguimiento","Pago","Total"], (Array.isArray(data)?data:[]).map(order => [order.order_number,order.created_at,order.customers?.full_name||"",order.customers?.phone||order.customers?.email||"",order.status,order.payment_status||"pending",order.total])));
          (Array.isArray(data) ? data : []).forEach((order, index) => {
            const footer = document.querySelectorAll(".order-card footer")[index]; if (!footer) return;
            const label = order.internal_label || "sin_etiqueta";
            footer.insertAdjacentHTML("beforeend", `<label>Etiqueta interna<select data-order-label="${order.id}"><option value="sin_etiqueta" ${label==="sin_etiqueta"?"selected":""}>Sin etiqueta</option><option value="esperando_transferencia" ${label==="esperando_transferencia"?"selected":""}>Esperando transferencia</option><option value="preparar" ${label==="preparar"?"selected":""}>Preparar</option><option value="entregado" ${label==="entregado"?"selected":""}>Entregado</option></select></label><button class="edit" type="button" data-save-order-label="${order.id}" data-current-label="${label}">Guardar etiqueta</button>`);
          });
          document.querySelectorAll("[data-save-order-label]").forEach(button => button.addEventListener("click", async () => { const select=document.querySelector(`[data-order-label="${button.dataset.saveOrderLabel}"]`); if(select.value===button.dataset.currentLabel)return; await callAdmin("updateOrderInternalLabel",{orderId:button.dataset.saveOrderLabel,internalLabel:select.value}); await loadView("orders"); }));
        }
        if (view === "customers") renderCustomers(data);
        if (view === "admins") renderAdmins(data);
        if (view === "catalog") renderCatalog(data);
        if (view === "coupons") renderCoupons(data);
        if (view === "experiences") renderExperiences(data);
        if (view === "history") renderHistory(data);
      } catch (error) {
        content.innerHTML = `<p class="empty">${escapeHtml(error.message)}</p>`;
      }
    }

    async function showApp(session) {
      document.querySelector("#accountEmail").textContent = session.user.email || "Cuenta administradora";
      loginView.classList.add("hidden");
      appView.classList.remove("hidden");
      if (appReady) return;
      appReady = true;
      await loadView(currentView);
    }

    function setup() {
      if (SUPABASE_ANON_KEY.startsWith("PEGAR_AQUI")) {
        setNotice("Falta configurar la clave pública de Supabase.");
        return;
      }
      supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      supabase.auth.getSession().then(({ data: { session } }) => { if (session) showApp(session); });
      supabase.auth.onAuthStateChange((event, session) => {
        if (event === "SIGNED_OUT") { appReady = false; return; }
        if (session && !appReady) showApp(session);
      });
    }

    document.querySelector("#loginForm").addEventListener("submit", async (event) => {
      event.preventDefault(); setNotice("");
      const email = document.querySelector("#email").value.trim();
      const password = document.querySelector("#password").value;
      const { error } = await supabase.auth.signInWithPassword({ email, password });
      if (error) setNotice("No se pudo ingresar. Revisá email y contraseña.");
    });
    document.querySelector("#googleLogin").addEventListener("click", async () => {
      setNotice("");
      const { error } = await supabase.auth.signInWithOAuth({ provider:"google", options:{ redirectTo:`${window.location.origin}/admin.html` } });
      if (error) setNotice("No se pudo iniciar con Google.");
    });
    document.querySelector("#logout").addEventListener("click", () => supabase.auth.signOut().then(() => location.reload()));
    document.querySelectorAll(".nav button").forEach(button => button.addEventListener("click", () => loadView(button.dataset.view)));
    setup();
  </script>
</body>
</html>
