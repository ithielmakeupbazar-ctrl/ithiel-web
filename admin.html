:root {

html { color-scheme: light; }
body { -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
button, a, input, textarea, select { font: inherit; }
button, a { -webkit-tap-highlight-color: transparent; }
button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible {
  outline: 3px solid var(--focus);
  outline-offset: 3px;
}
[hidden] { display: none !important; }

@keyframes page-in {
  from { opacity: 0; transform: translateY(18px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes item-in {
  from { opacity: 0; transform: translateY(22px) scale(.98); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}
@keyframes cart-pop {
  0%, 100% { transform: scale(1); }
  45% { transform: scale(1.22); }
}
.is-cart-pop { animation: cart-pop .38s var(--ease-out); }
.message { font-weight: 650; }
.message.is-error, .notice.is-error { color: #a25119 !important; }
.message.is-success, .notice.is-success { color: #16804b !important; }
.message.is-muted, .notice.is-muted { color: #765763 !important; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {

    function showProductError(error) { content.innerHTML = `<p class="empty">${escapeHtml(error?.message || "No se pudo abrir el producto.")}</p>`; }
    function viewHead(label, title, copy, action = "") { return `<section class="view-head"><div><span class="eyebrow">${label}</span><h2>${title}</h2><p>${copy}</p></div>${action}</section>`; }
    const icons = {
      edit:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4l11-11-4-4L4 16v4Z"></path></svg>',
      pause:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14M16 5v14"></path></svg>',
      play:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 5 11 7-11 7V5Z"></path></svg>',
      trash:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M7 7l1 13h8l1-13"></path></svg>'
    };

    async function callAdmin(action, payload = {}) {
      const { data: { session } } = await supabase.auth.getSession();
      if (!session) throw new Error("Tu sesión venció. Volvé a ingresar.");
      const response = await fetch(ADMIN_API, {
        method: "POST",
        headers: { "Content-Type":"application/json", apikey:SUPABASE_ANON_KEY, Authorization:`Bearer ${session.access_token}` },
        body: JSON.stringify({ action, ...payload }),
      });
      const result = await response.json();
      if (!response.ok) throw new Error(result.error || "No se pudo cargar la información.");
      return result.data;
    }

          <button class="card dashboard-link" type="button" data-go-view="orders"><small>Pedidos pendientes</small><strong>${t.pendingOrders}</strong></button>
          <button class="card dashboard-link" type="button" data-go-view="coupons"><small>Cupones activos</small><strong>${t.activeCoupons}</strong></button>
        </div>
        <div class="dashboard-grid">
          <section class="panel"><h2>Productos para revisar</h2>
            ${data.alerts.length ? `<table><thead><tr><th>Producto</th><th>SKU</th><th>Referencia</th><th>Estado</th></tr></thead><tbody>${data.alerts.slice(0,6).map(p => `<tr><td>${escapeHtml(p.name)}</td><td>${escapeHtml(p.sku)}</td><td><span class="pill low">${p.stock}</span></td><td>${statusLabel(p.status)}</td></tr>`).join("")}</tbody></table>` : '<p class="empty">No hay productos para revisar.</p>'}

      document.querySelectorAll("[data-go-view]").forEach(button => button.addEventListener("click", () => loadView(button.dataset.goView)));

    async function renderProductForm(product = null) {
      const options = await callAdmin("catalogOptions");
      const categoryOptions = ['<option value="">Elegir categoría</option>', ...options.categories.map(c => `<option value="${c.id}" ${product?.category_id === c.id ? "selected" : ""}>${escapeHtml(c.name)}</option>`)].join("");
      const inferredSupplier = product?.supplier_price ?? (product?.retail_price ? Math.round(Number(product.retail_price) / 1.8) : "");
      const variantRow = (variant = {}) => `<div class="variant-row" data-variant-row>
        <input type="hidden" data-variant-id value="${escapeHtml(variant.id || "")}">
        <label>Color<input data-variant-color maxlength="80" value="${escapeHtml(variant.color || "")}" placeholder="Ej.: Rosa"></label>
        <label>Talle<input data-variant-size maxlength="40" value="${escapeHtml(variant.size || "")}" placeholder="Ej.: M"></label>
        <label>SKU<input data-variant-sku maxlength="80" value="${escapeHtml(variant.sku || "")}" placeholder="Opcional"></label>
        <label>Stock<input data-variant-stock type="number" min="0" value="${Number(variant.stock ?? 0)}"></label>
        <label class="check variant-active"><input data-variant-active type="checkbox" ${variant.active === false ? "" : "checked"}> Disponible</label>
        <button class="icon-action delete" type="button" data-remove-variant aria-label="Quitar variante">${icons.trash}</button>
      </div>`;
      const existingVariants = product?.product_variants || [];
      content.innerHTML = `<div class="product-form-modal"><section class="product-form-card">
        <header class="form-top"><div><span class="eyebrow">${product ? "EDITAR PRODUCTO" : "NUEVO PRODUCTO"}</span><h2>${product ? "Editar producto" : "Agregar producto"}</h2></div><button id="backProducts" class="icon-action" type="button" aria-label="Cerrar">×</button></header>
        <form id="productForm" class="product-form">
          <label class="wide upload-field">Imágenes del producto<input id="productPhoto" type="file" accept="image/jpeg,image/png,image/webp" multiple><small>Hasta 8 archivos JPG, PNG o WEBP de 4 MB cada uno.</small><span id="photoSelection" class="photo-selection" aria-live="polite"></span><span id="photoPreview" class="photo-preview"></span></label>
          <label class="wide">Nombre del producto<input id="productName" required maxlength="180" value="${escapeHtml(product?.name || "")}"></label>
          <label class="wide">Descripción<textarea id="productDescription" rows="3" maxlength="1500">${escapeHtml(product?.description || "")}</textarea></label>
          <label>Categoría<select id="productCategory" required>${categoryOptions}</select></label>
          <label>Subcategoría<select id="productSubcategory"><option value="">Sin subcategoría</option></select></label>
          <label>Código / SKU<input value="${escapeHtml(product?.sku || "Se genera automáticamente")}" readonly></label>
          <label>Precio proveedor · interno<input id="productSupplier" type="number" min="1" value="${inferredSupplier}"><small>Completarlo calcula los otros dos.</small></label>
          <label>Precio minorista<input id="productRetail" type="number" min="1" value="${product?.retail_price || ""}"><small>Editable · sugerido: proveedor + 80%</small></label>
          <label>Precio mayorista<input id="productWholesale" type="number" min="1" value="${product?.wholesale_price || ""}"><small>Editable · sugerido: minorista - 20%</small></label>
          <label>Stock<input id="productStock" type="number" min="0" required value="${product?.stock ?? 30}"><small>Si agregás variantes, se calcula con la suma de sus stocks.</small></label>
          <label>Estado<select id="productStatus"><option value="published" ${product?.status === "published" ? "selected" : ""}>Publicado</option><option value="draft" ${product?.status === "draft" ? "selected" : ""}>Borrador</option><option value="archived" ${product?.status === "archived" ? "selected" : ""}>Oculto</option></select></label>
          <section class="wide variant-editor">
            <div class="variant-editor-head"><div><h3>Variantes</h3><p>Agregalas solo si el producto tiene colores o talles.</p></div><button id="addVariant" class="outline" type="button">+ Agregar variante</button></div>
            <div id="variantRows" class="variant-rows">${existingVariants.map(variantRow).join("")}</div>
            <p id="noVariants" class="empty compact-empty" ${existingVariants.length ? "hidden" : ""}>Este producto no tiene variantes.</p>
          </section>
          ${product?.product_images?.length ? `<div class="wide"><label>Fotos actuales</label><div class="product-photos">${product.product_images.map(image => `<div class="product-photo"><img src="${escapeHtml(image.image_url)}" alt=""><button class="edit" type="button" data-delete-image="${image.id}">Quitar</button></div>`).join("")}</div></div>` : ""}
          <footer class="wide form-footer"><button id="cancelProduct" class="outline" type="button">Cancelar</button><button class="primary" type="submit">${product ? "Guardar cambios" : "Crear producto"}</button></footer>
        </form><p id="productMessage" class="notice" aria-live="polite"></p>
      </section></div>`;
      const category = document.querySelector("#productCategory");
      const subcategory = document.querySelector("#productSubcategory");
      const supplier = document.querySelector("#productSupplier");
      const retail = document.querySelector("#productRetail");
      const wholesale = document.querySelector("#productWholesale");
      const photoInput = document.querySelector("#productPhoto");
      const photoSelection = document.querySelector("#photoSelection");
      const photoPreview = document.querySelector("#photoPreview");
      const calculatePrices = () => { const cost=Number(supplier.value)||0; const retailValue=cost?Math.ceil((cost*1.8)/500)*500:0; retail.value=retailValue||""; wholesale.value=retailValue?Math.round(retailValue*.8):""; };
      const fillSubcategories = () => { const selected=category.value; subcategory.innerHTML='<option value="">Sin subcategoría</option>'+options.subcategories.filter(s=>s.category_id===selected).map(s=>`<option value="${s.id}" ${product?.subcategory_id===s.id?"selected":""}>${escapeHtml(s.name)}</option>`).join(""); };
      supplier.addEventListener("input", calculatePrices);
      const variantRows = document.querySelector("#variantRows");
      const updateVariantEmpty = () => { document.querySelector("#noVariants").hidden = Boolean(variantRows.children.length); };
      document.querySelector("#addVariant").addEventListener("click", () => { variantRows.insertAdjacentHTML("beforeend", variantRow()); updateVariantEmpty(); });
      variantRows.addEventListener("click", (event) => { const button=event.target.closest("[data-remove-variant]"); if (!button) return; button.closest("[data-variant-row]").remove(); updateVariantEmpty(); });
      photoInput.addEventListener("change", () => {
        const files = [...photoInput.files];
        photoSelection.textContent = files.length ? `${files.length} imagen${files.length === 1 ? "" : "es"} seleccionada${files.length === 1 ? "" : "s"}.` : "";
        photoPreview.replaceChildren(...files.map((file) => {
          const image = document.createElement("img");
          image.src = URL.createObjectURL(file);
          image.alt = `Vista previa de ${file.name}`;
          image.onload = () => URL.revokeObjectURL(image.src);
          return image;
        }));
      });
      category.addEventListener("change", () => { product={...product,subcategory_id:""}; fillSubcategories(); });
      fillSubcategories();
      document.querySelector("#backProducts").addEventListener("click",()=>loadView("products"));
      document.querySelector("#cancelProduct").addEventListener("click",()=>loadView("products"));
      document.querySelectorAll("[data-delete-image]").forEach(button=>button.addEventListener("click",async()=>{if(!confirm("¿Quitar esta foto del producto?"))return;try{await callAdmin("deleteProductImage",{imageId:button.dataset.deleteImage});const products=await callAdmin("products");await renderProductForm(products.find(item=>item.id===product.id))}catch(error){alert(error.message)}}));
      document.querySelector("#productForm").addEventListener("submit",async(event)=>{event.preventDefault();const message=document.querySelector("#productMessage");message.className="notice is-muted";message.textContent="Guardando…";try{const photos=[...photoInput.files];if(photos.length>8)throw new Error("Podés subir hasta 8 imágenes por vez.");const oversized=photos.find(file=>file.size>4*1024*1024);if(oversized)throw new Error(`La imagen ${oversized.name} supera los 4 MB.`);const variants=[...document.querySelectorAll("[data-variant-row]")].map(row=>({id:row.querySelector("[data-variant-id]").value,color:row.querySelector("[data-variant-color]").value.trim(),size:row.querySelector("[data-variant-size]").value.trim(),sku:row.querySelector("[data-variant-sku]").value.trim(),stock:row.querySelector("[data-variant-stock]").value,active:row.querySelector("[data-variant-active]").checked}));if(variants.some(item=>!item.color&&!item.size))throw new Error("Cada variante debe tener color, talle o ambos.");const result=await callAdmin("saveProduct",{id:product?.id||"",name:document.querySelector("#productName").value,description:document.querySelector("#productDescription").value,categoryId:category.value,subcategoryId:subcategory.value,supplierPrice:supplier.value,retailPrice:retail.value,wholesalePrice:wholesale.value,stock:document.querySelector("#productStock").value,status:document.querySelector("#productStatus").value,variants});for(const photo of photos){const dataUrl=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=reject;reader.readAsDataURL(photo)});await callAdmin("uploadProductImage",{productId:result.id,dataUrl})}message.className="notice is-success";message.textContent=result.created?"Producto creado.":"Producto actualizado.";setTimeout(()=>loadView("products"),550)}catch(error){message.className="notice is-error";message.textContent=error.message}});
    }

    function renderProducts(products) {
      const productList = Array.isArray(products) ? products : products?.products || [];
      const categoryList = Array.isArray(products?.categories) ? products.categories : [];
      const productRow = p => `<tr>
        <td>${p.product_images?.[0]?.image_url ? `<img class="photo-thumb" src="${escapeHtml(p.product_images[0].image_url)}" alt="">` : "—"}</td>
        <td><strong>${escapeHtml(p.name)}</strong><br><small>${escapeHtml(p.sku)}</small></td>
        <td><select class="row-select" data-product-category="${p.id}">${categoryList.map(c => `<option value="${c.id}" ${c.id === p.category_id ? "selected" : ""}>${escapeHtml(c.name)}</option>`).join("")}</select></td>
        <td>${money(p.retail_price)}</td>
        <td>${money(p.wholesale_price)}</td>
        <td><span class="pill ${Number(p.stock) <= 5 ? "low" : ""}">${p.stock}</span></td>
        <td>${statusLabel(p.status)}</td>
        <td><div class="actions actions-stack"><button class="icon-action" data-edit-product="${p.id}" title="Editar">${icons.edit}</button><button class="icon-action" data-toggle-product="${p.id}" title="${p.status === "published" ? "Ocultar" : "Publicar"}">${p.status === "published" ? icons.pause : icons.play}</button><button class="icon-action delete" data-delete-product="${p.id}" title="Eliminar">${icons.trash}</button></div></td>
      </tr>`;
      const rows = items => items.length ? `<table><thead><tr><th>Foto</th><th>Producto</th><th>Categoría</th><th>Minorista</th><th>Mayorista</th><th>Stock</th><th>Estado</th><th>Acciones</th></tr></thead><tbody>${items.map(productRow).join("")}</tbody></table>` : '<p class="empty">No encontramos productos.</p>';
      content.innerHTML = `${viewHead("PRODUCTOS","Administrar productos","Agregá, editá precios y organizá productos.",'<button id="newProduct" class="primary" type="button">+ Agregar producto</button>')}<section class="panel"><input id="productSearch" class="product-search" type="search" placeholder="Buscar por nombre, SKU, categoría o estado…"><div id="productRows">${rows(productList)}</div></section>`;
      document.querySelector("#newProduct").addEventListener("click",()=>renderProductForm().catch(showProductError));
      const wireRows=()=>{document.querySelectorAll("[data-edit-product]").forEach(button=>button.addEventListener("click",()=>renderProductForm(productList.find(p=>p.id===button.dataset.editProduct)).catch(showProductError)));document.querySelectorAll("[data-toggle-product]").forEach(button=>button.addEventListener("click",async()=>{const p=productList.find(item=>item.id===button.dataset.toggleProduct);try{await callAdmin("saveProduct",{id:p.id,name:p.name,description:p.description||"",categoryId:p.category_id,subcategoryId:p.subcategory_id||"",supplierPrice:p.supplier_price,retailPrice:p.retail_price,wholesalePrice:p.wholesale_price,stock:p.stock,status:p.status==="published"?"archived":"published"});await loadView("products")}catch(error){alert(error.message)}}));document.querySelectorAll("[data-delete-product]").forEach(button=>button.addEventListener("click",async()=>{const product=productList.find(p=>p.id===button.dataset.deleteProduct);if(!confirm(`¿Eliminar definitivamente “${product?.name||"este producto"}”?`))return;try{await callAdmin("deleteProduct",{productId:button.dataset.deleteProduct});await loadView("products")}catch(error){alert(error.message)}}));document.querySelectorAll("[data-product-category]").forEach(select=>select.addEventListener("change",async()=>{const product=productList.find(item=>item.id===select.dataset.productCategory);if(!product)return;try{await callAdmin("saveProduct",{id:product.id,name:product.name,description:product.description||"",categoryId:select.value,subcategoryId:product.subcategory_id||"",supplierPrice:product.supplier_price,retailPrice:product.retail_price,wholesalePrice:product.wholesale_price,stock:product.stock,status:product.status,variants:product.product_variants||[]});await loadView("products")}catch(error){alert(error.message);await loadView("products")}}))};
      document.querySelector("#productSearch").addEventListener("input",event=>{const term=event.target.value.trim().toLocaleLowerCase("es-AR");const filtered=productList.filter(p=>`${p.name} ${p.sku} ${p.status} ${p.categories?.name||""} ${p.subcategories?.name||""}`.toLocaleLowerCase("es-AR").includes(term));document.querySelector("#productRows").innerHTML=rows(filtered);wireRows()});
      wireRows();
    }

    function formatDate(value) {
      return value ? new Date(value).toLocaleString("es-AR", { dateStyle:"short", timeStyle:"short" }) : "—";
    }

    function renderOrders(orders) {
      const items = Array.isArray(orders) ? orders : [];
      const statusOptions = [
        ["pending", "Pendiente"], ["processing", "En proceso"],
        ["completed", "Completado"], ["cancelled", "Cancelado"],
      ];
      const cards = items.map(order => {
        const customer = order.customers || {};
        const products = Array.isArray(order.order_items) ? order.order_items : [];
        const productRows = products.map(item => `<tr><td><strong>${escapeHtml(item.product_name)}</strong>${item.variant_name ? `<br><small>${escapeHtml(item.variant_name)}</small>` : ""}</td><td>${Number(item.quantity || 0)}</td><td>${money(item.unit_price)}</td><td>${money(item.line_total)}</td></tr>`).join("");
        return `<article class="order-card">
          <header><div><span class="eyebrow">PEDIDO #${escapeHtml(order.order_number)}</span><h3>${escapeHtml(customer.full_name || "Compra sin seguimiento")}</h3><p>${formatDate(order.created_at)}</p></div>${statusLabel(order.status)}</header>
          <div class="order-meta"><span><b>Tipo</b>${order.purchase_type === "wholesale" ? "Mayorista" : "Minorista"}</span><span><b>Entrega</b>${order.fulfillment_type === "shipping" ? "Envío" : "Retiro"}</span><span><b>Productos</b>${Number(order.item_count || 0)}</span><span><b>Total</b>${money(order.total)}</span></div>
          <div class="order-contact"><p><b>Contacto:</b> ${escapeHtml(customer.phone || customer.email || "No solicitado")}</p>${order.shipping_address ? `<p><b>Dirección:</b> ${escapeHtml(order.shipping_address)}</p>` : ""}${order.customer_note ? `<p><b>Nota:</b> ${escapeHtml(order.customer_note)}</p>` : ""}${order.coupon_code ? `<p><b>Cupón:</b> ${escapeHtml(order.coupon_code)} · Descuento ${money(order.discount_amount)}</p>` : ""}</div>
          <div class="order-products"><table><thead><tr><th>Producto</th><th>Cant.</th><th>Precio</th><th>Subtotal</th></tr></thead><tbody>${productRows || '<tr><td colspan="4">Sin detalle disponible.</td></tr>'}</tbody></table></div>
          <footer><label>Estado<select data-order-status="${order.id}">${statusOptions.map(([value,label]) => `<option value="${value}" ${order.status === value ? "selected" : ""}>${label}</option>`).join("")}</select></label></footer>
        </article>`;
      }).join("");
      content.innerHTML = `${viewHead("PEDIDOS", "Pedidos", "Compras registradas, productos y seguimiento.")}<section class="orders-grid">${cards || '<p class="empty">Todavía no hay pedidos registrados.</p>'}</section>`;
      document.querySelectorAll("[data-order-status]").forEach(select => select.addEventListener("change", async () => {
        select.disabled = true;
        try { await callAdmin("updateOrderStatus", { orderId:select.dataset.orderStatus, status:select.value }); await loadView("orders"); }
        catch (error) { alert(error.message); await loadView("orders"); }
      }));
    }

    function renderCatalog(data) {
      const categories = Array.isArray(data?.categories) ? data.categories : [];
      const subcategories = Array.isArray(data?.subcategories) ? data.subcategories : [];
      const categoryOptions = (selected = "") => categories.map(category => `<option value="${category.id}" ${category.id === selected ? "selected" : ""}>${escapeHtml(category.name)}</option>`).join("");
      content.innerHTML = `${viewHead("CATÁLOGO", "Categorías y subcategorías", "Organizá el catálogo y revisá cuántos productos contiene cada sección.")}
        <section class="catalog-create-grid">
          <form id="newCategoryForm" class="panel compact-form"><h2>Nueva categoría</h2><label>Nombre<input id="newCategoryName" required maxlength="100" placeholder="Ej.: Bazar"></label><button class="primary" type="submit">Agregar</button></form>
          <form id="newSubcategoryForm" class="panel compact-form"><h2>Subcategoría</h2><label>Nombre<input id="newSubcategoryName" required maxlength="100" placeholder="Ej.: Cocina"></label><label>Categoría<select id="newSubcategoryCategory" required><option value="">Elegir categoría</option>${categoryOptions()}</select></label><button class="primary" type="submit">Agregar</button></form>
        </section>
        <section class="panel section-spaced"><h2>Categorías</h2><div class="management-list">${categories.map(category => `<div class="management-row"><input data-category-name="${category.id}" value="${escapeHtml(category.name)}"><span class="pill">${Number(category.product_count || 0)} productos</span>${statusLabel(category.active ? "published" : "archived")}<div class="row-actions"><button class="edit" data-save-category="${category.id}">Guardar</button><button class="edit" data-toggle-category="${category.id}">${category.active ? "Pausar" : "Activar"}</button><button class="edit delete" data-delete-category="${category.id}">Eliminar</button></div></div>`).join("") || '<p class="empty">No hay categorías.</p>'}</div></section>
        <section class="panel section-spaced"><h2>Subcategorías</h2><div class="management-list">${subcategories.map(item => `<div class="management-row subcategory-row"><input data-subcategory-name="${item.id}" value="${escapeHtml(item.name)}"><select data-subcategory-category="${item.id}">${categoryOptions(item.category_id)}</select><span class="pill">${Number(item.product_count || 0)} productos</span>${statusLabel(item.active ? "published" : "archived")}<div class="row-actions"><button class="edit" data-save-subcategory="${item.id}">Guardar</button><button class="edit" data-toggle-subcategory="${item.id}">${item.active ? "Pausar" : "Activar"}</button><button class="edit delete" data-delete-subcategory="${item.id}">Eliminar</button></div></div>`).join("") || '<p class="empty">No hay subcategorías.</p>'}</div></section>`;
      document.querySelector("#newCategoryForm").addEventListener("submit", async event => { event.preventDefault(); try { await callAdmin("saveCategory", { name:document.querySelector("#newCategoryName").value }); await loadView("catalog"); } catch (error) { alert(error.message); } });
      document.querySelector("#newSubcategoryForm").addEventListener("submit", async event => { event.preventDefault(); try { await callAdmin("saveSubcategory", { name:document.querySelector("#newSubcategoryName").value, categoryId:document.querySelector("#newSubcategoryCategory").value }); await loadView("catalog"); } catch (error) { alert(error.message); } });
      document.querySelectorAll("[data-save-category]").forEach(button => button.addEventListener("click", async () => { const category=categories.find(item=>item.id===button.dataset.saveCategory); try { await callAdmin("saveCategory", { categoryId:category.id, name:document.querySelector(`[data-category-name="${category.id}"]`).value, active:category.active }); await loadView("catalog"); } catch(error){ alert(error.message); } }));
      document.querySelectorAll("[data-toggle-category]").forEach(button => button.addEventListener("click", async () => { const category=categories.find(item=>item.id===button.dataset.toggleCategory); try { await callAdmin("saveCategory", { categoryId:category.id, name:category.name, active:!category.active }); await loadView("catalog"); } catch(error){ alert(error.message); } }));
      document.querySelectorAll("[data-delete-category]").forEach(button => button.addEventListener("click", async () => { if(!confirm("¿Eliminar esta categoría?"))return; try { await callAdmin("deleteCategory", { categoryId:button.dataset.deleteCategory }); await loadView("catalog"); } catch(error){ alert(error.message); } }));
      document.querySelectorAll("[data-save-subcategory]").forEach(button => button.addEventListener("click", async () => { const item=subcategories.find(row=>row.id===button.dataset.saveSubcategory); try { await callAdmin("saveSubcategory", { subcategoryId:item.id, name:document.querySelector(`[data-subcategory-name="${item.id}"]`).value, categoryId:document.querySelector(`[data-subcategory-category="${item.id}"]`).value, active:item.active }); await loadView("catalog"); } catch(error){ alert(error.message); } }));
      document.querySelectorAll("[data-toggle-subcategory]").forEach(button => button.addEventListener("click", async () => { const item=subcategories.find(row=>row.id===button.dataset.toggleSubcategory); try { await callAdmin("saveSubcategory", { subcategoryId:item.id, name:item.name, categoryId:item.category_id, active:!item.active }); await loadView("catalog"); } catch(error){ alert(error.message); } }));
      document.querySelectorAll("[data-delete-subcategory]").forEach(button => button.addEventListener("click", async () => { if(!confirm("¿Eliminar esta subcategoría?"))return; try { await callAdmin("deleteSubcategory", { subcategoryId:button.dataset.deleteSubcategory }); await loadView("catalog"); } catch(error){ alert(error.message); } }));
    }

    function renderCustomers(customers) {
      const items = Array.isArray(customers) ? customers : [];
      content.innerHTML = `${viewHead("CLIENTES", "Clientes", "Cuentas registradas y contactos con seguimiento.")}
        <section class="panel"><form id="customerForm" class="customer-form"><label>Nombre<input id="customerName" required maxlength="100"></label><label>WhatsApp<input id="customerPhone" required placeholder="549341..."></label><label class="check"><input id="customerConsent" type="checkbox"> Acepta WhatsApp</label><button class="primary" type="submit">Agregar cliente</button></form>
        ${items.length ? `<table><thead><tr><th>Cliente</th><th>Contacto</th><th>Tipo</th><th>Alta</th><th>Acción</th></tr></thead><tbody>${items.map(customer => `<tr><td><strong>${escapeHtml(customer.full_name || "Cuenta registrada")}</strong></td><td>${escapeHtml(customer.phone || customer.email || "Sin completar")}</td><td><span class="pill">${customer.auth_user_id ? "Registrado" : "Invitado"}</span></td><td>${formatDate(customer.created_at)}</td><td>${customer.id && !customer.auth_user_id ? `<button class="edit delete" data-delete-customer="${customer.id}">Eliminar</button>` : "—"}</td></tr>`).join("")}</tbody></table>` : '<p class="empty">Todavía no hay clientes.</p>'}</section>`;
      document.querySelector("#customerForm").addEventListener("submit", async event => { event.preventDefault(); try { await callAdmin("createCustomer", { fullName:document.querySelector("#customerName").value, phone:document.querySelector("#customerPhone").value, whatsappOptIn:document.querySelector("#customerConsent").checked }); await loadView("customers"); } catch(error){ alert(error.message); } });
      document.querySelectorAll("[data-delete-customer]").forEach(button => button.addEventListener("click", async () => { if(!confirm("¿Eliminar este cliente?"))return; try { await callAdmin("deleteCustomer", { customerId:button.dataset.deleteCustomer }); await loadView("customers"); } catch(error){ alert(error.message); } }));
    }

    function renderExperiences(experiences) {
      const items = Array.isArray(experiences) ? experiences : [];
      content.innerHTML = `${viewHead("EXPERIENCIAS", "Experiencias", "Aprobá los comentarios que se muestran públicamente.")}<section class="panel">${items.length ? `<div class="experience-list">${items.map(item => `<article class="experience-admin-card"><header><div><h3>${escapeHtml(item.display_name || "Cliente")}</h3><p>${Number(item.rating || 0)}/5 · ${formatDate(item.created_at)}</p></div><span class="pill ${item.approved ? "" : "low"}">${item.approved ? "Publicada" : "Pendiente"}</span></header><p>${escapeHtml(item.comment)}</p><footer><button class="edit" data-toggle-experience="${item.id}">${item.approved ? "Pausar" : "Aprobar"}</button><button class="edit delete" data-delete-experience="${item.id}">Eliminar</button></footer></article>`).join("")}</div>` : '<p class="empty">Todavía no hay experiencias.</p>'}</section>`;
      document.querySelectorAll("[data-toggle-experience]").forEach(button => button.addEventListener("click", async () => { const item=items.find(row=>row.id===button.dataset.toggleExperience); try { await callAdmin("updateExperience", { experienceId:item.id, approved:!item.approved }); await loadView("experiences"); } catch(error){ alert(error.message); } }));
      document.querySelectorAll("[data-delete-experience]").forEach(button => button.addEventListener("click", async () => { if(!confirm("¿Eliminar esta experiencia?"))return; try { await callAdmin("deleteExperience", { experienceId:button.dataset.deleteExperience }); await loadView("experiences"); } catch(error){ alert(error.message); } }));
    }

    function renderAdmins(admins) {
      const items = Array.isArray(admins) ? admins : [];
      content.innerHTML = `${viewHead("ACCESOS", "Administradores", "Personas autorizadas para gestionar el negocio.")}<section class="panel"><form id="adminForm" class="inline-create-form"><label>Email de la cuenta<input id="adminEmail" type="email" required placeholder="nombre@email.com"></label><button class="primary" type="submit">Agregar administrador</button></form>${items.length ? `<table><thead><tr><th>Email</th><th>Acceso</th><th>Acción</th></tr></thead><tbody>${items.map(admin => `<tr><td><strong>${escapeHtml(admin.email)}</strong></td><td><span class="pill">Administrador</span></td><td><button class="edit delete" data-revoke-admin="${admin.user_id}">Quitar acceso</button></td></tr>`).join("")}</tbody></table>` : '<p class="empty">No hay administradores configurados.</p>'}</section>`;
      document.querySelector("#adminForm").addEventListener("submit", async event => { event.preventDefault(); try { await callAdmin("grantAdmin", { email:document.querySelector("#adminEmail").value }); await loadView("admins"); } catch(error){ alert(error.message); } });
      document.querySelectorAll("[data-revoke-admin]").forEach(button => button.addEventListener("click", async () => { if(!confirm("¿Quitar el acceso de administrador?"))return; try { await callAdmin("revokeAdmin", { userId:button.dataset.revokeAdmin }); await loadView("admins"); } catch(error){ alert(error.message); } }));
    }

    function renderCoupons(coupons) {
      const items = Array.isArray(coupons) ? coupons : coupons?.coupons || [];
      const normalizeDate = (value) => value ? new Intl.DateTimeFormat("en-CA", { timeZone:"America/Argentina/Buenos_Aires", year:"numeric", month:"2-digit", day:"2-digit" }).format(new Date(value)) : "";
      const discountLabel = (coupon) => `${Number(coupon.discount_percent || 0)}%`;
      const validity = (coupon) => {
        const start = coupon.starts_at ? new Date(coupon.starts_at).toLocaleDateString("es-AR") : "Ahora";
        const end = coupon.expires_at ? new Date(coupon.expires_at).toLocaleDateString("es-AR") : "Sin vencimiento";
        return `${start} → ${end}`;
      };
      const rows = () => items.length ? `<table><thead><tr><th>Código</th><th>Descuento</th><th>Vigencia</th><th>Estado</th><th>Acción</th></tr></thead><tbody>${items.map(coupon => `<tr>
        <td><strong>${escapeHtml(coupon.code)}</strong></td>
        <td>${discountLabel(coupon)}</td>
        <td>${escapeHtml(validity(coupon))}</td>
        <td><span class="pill ${coupon.active ? "" : "low"}">${coupon.active ? "Activo" : "Inactivo"}</span></td>
        <td><button class="edit" type="button" data-edit-coupon="${coupon.id}">Editar</button><button class="edit" type="button" data-toggle-coupon="${coupon.id}">${coupon.active ? "Desactivar" : "Activar"}</button><button class="edit delete" type="button" data-delete-coupon="${coupon.id}" title="Eliminar cupón">🗑</button></td>
      </tr>`).join("")}</tbody></table>` : '<p class="empty">Todavía no hay cupones creados.</p>';

      content.innerHTML = `${viewHead("CUPONES","Administrar cupones","Descuentos y vigencia.")}<section class="panel"><h2>Cupones de descuento</h2>
        <p class="lead">Creá códigos porcentuales y definí durante qué período pueden usarse en el carrito.</p>
        <form id="couponForm" class="coupon-form">
          <input id="couponId" type="hidden">
          <label>Código<input id="couponCode" required maxlength="40" autocomplete="off" placeholder="Ej.: BIENVENIDA10"></label>
          <label>Descuento (%)<input id="couponValue" type="number" min="1" max="100" step="1" required placeholder="10"></label>
          <label>Desde<input id="couponStartsAt" type="date" required></label>
          <label>Hasta<input id="couponExpiresAt" type="date" required></label>
          <label class="check coupon-active"><input id="couponActive" type="checkbox" checked> Cupón activo</label>
          <div class="coupon-form-actions"><button class="primary" type="submit">Guardar cupón</button><button id="cancelCouponEdit" class="outline hidden" type="button">Cancelar edición</button></div>
        </form>
        <p id="couponMessage" class="notice" aria-live="polite"></p>
        <div id="couponRows" class="coupon-table">${rows()}</div>
      </section>`;

      const form = document.querySelector("#couponForm");
      const message = document.querySelector("#couponMessage");
      const cancel = document.querySelector("#cancelCouponEdit");
      const resetForm = () => {
        form.reset();
        document.querySelector("#couponId").value = "";
        document.querySelector("#couponActive").checked = true;
        cancel.classList.add("hidden");
        message.textContent = "";
      };
      const editCoupon = (coupon) => {
        document.querySelector("#couponId").value = coupon.id;
        document.querySelector("#couponCode").value = coupon.code || "";
        document.querySelector("#couponValue").value = coupon.discount_percent || "";
        document.querySelector("#couponStartsAt").value = normalizeDate(coupon.starts_at);
        document.querySelector("#couponExpiresAt").value = normalizeDate(coupon.expires_at);
        document.querySelector("#couponActive").checked = Boolean(coupon.active);
        cancel.classList.remove("hidden");
        form.scrollIntoView({ behavior:"smooth", block:"start" });
      };
      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const value = Number(document.querySelector("#couponValue").value);
        const startsAt = document.querySelector("#couponStartsAt").value;
        const expiresAt = document.querySelector("#couponExpiresAt").value;
        if (value > 100) { message.className = "notice is-error"; message.textContent = "El porcentaje no puede superar 100%."; return; }
        if (expiresAt <= startsAt) { message.className = "notice is-error"; message.textContent = "El vencimiento debe ser posterior al inicio."; return; }
        message.className = "notice is-muted"; message.textContent = "Guardando cupón…";
        try {
          await callAdmin("saveCoupon", {
            couponId: document.querySelector("#couponId").value,
            code: document.querySelector("#couponCode").value.trim().toUpperCase(),
            discountPercent: value,
            startsAt,
            expiresAt,
            active: document.querySelector("#couponActive").checked,
          });
          message.className = "notice is-success"; message.textContent = "Cupón guardado.";
          setTimeout(() => loadView("coupons"), 450);
        } catch (error) { message.className = "notice is-error"; message.textContent = error.message; }
      });
      cancel.addEventListener("click", resetForm);
      document.querySelectorAll("[data-edit-coupon]").forEach(button => button.addEventListener("click", () => editCoupon(items.find(coupon => coupon.id === button.dataset.editCoupon))));
      document.querySelectorAll("[data-toggle-coupon]").forEach(button => button.addEventListener("click", async () => {
        const coupon = items.find(item => item.id === button.dataset.toggleCoupon);
        try { await callAdmin("saveCoupon", {
          couponId:coupon.id, code:coupon.code, discountPercent:coupon.discount_percent,
          startsAt:normalizeDate(coupon.starts_at), expiresAt:normalizeDate(coupon.expires_at), active:!coupon.active,
        }); await loadView("coupons"); }
        catch (error) { alert(error.message); }
      }));
      document.querySelectorAll("[data-delete-coupon]").forEach(button => button.addEventListener("click", async () => {
        const coupon = items.find(item => item.id === button.dataset.deleteCoupon);
        if (!confirm(`¿Eliminar definitivamente el cupón “${coupon?.code || ""}”?`)) return;
        try { await callAdmin("deleteCoupon", { couponId:button.dataset.deleteCoupon }); await loadView("coupons"); }
        catch (error) { alert(error.message); }
      }));
    }

    async function renderAccount() {
      const { data: { session } } = await supabase.auth.getSession();
      const user = session?.user;
      const meta = user?.user_metadata || {};
      let recentOrders = [];
      try { recentOrders = (await callAdmin("orders") || []).slice(0,3); } catch (_error) {}
      const initials = String(meta.full_name || user?.email || "IH").split(/\s+|@/).filter(Boolean).slice(0,2).map(part=>part[0]).join("").toUpperCase();
      content.innerHTML = `${viewHead("MI CUENTA","Datos de la cuenta","Perfil, seguridad y actividad.")}
        <section class="account-grid">
          <article class="account-card"><div style="display:flex;align-items:center;gap:14px"><span style="display:grid;place-items:center;width:72px;height:72px;border-radius:22px;background:linear-gradient(145deg,#d889a7,#a70d4c);color:#fff;font:600 23px 'Playfair Display',serif">${escapeHtml(initials)}</span><div><h3>${escapeHtml(meta.full_name || "Ithiel")}</h3><p>Cuenta administradora.</p></div></div><form id="accountProfileForm" class="account-fields"><label>Nombre visible<input id="accountName" value="${escapeHtml(meta.full_name || "")}" placeholder="Ithiel"></label><label>Email<input value="${escapeHtml(user?.email || "")}" readonly></label><label>Teléfono<input id="accountPhone" value="${escapeHtml(meta.phone || "")}" placeholder="+54 9 341..."></label><label>Rol<input value="Admin" readonly></label><div class="wide actions"><button class="primary" type="submit">Guardar perfil</button></div></form><p id="profileMessage" class="notice"></p></article>
          <article class="account-card"><h3>Seguridad</h3><p>Ingreso y contraseña.</p><table><tbody><tr><td><strong>Contraseña</strong><br><small>Recibí un enlace seguro por email.</small></td><td><button id="sendPasswordReset" class="soft-action" type="button">Cambiar</button></td></tr><tr><td><strong>Google</strong><br><small>${user?.app_metadata?.provider === "google" ? "Conectado" : "Disponible para iniciar sesión"}</small></td><td><span class="pill">${user?.app_metadata?.provider === "google" ? "Activo" : "Opcional"}</span></td></tr><tr><td><strong>Sesión actual</strong><br><small>${user?.last_sign_in_at ? new Date(user.last_sign_in_at).toLocaleString("es-AR") : "Activa"}</small></td><td><span class="pill">Activa</span></td></tr></tbody></table><p id="adminAccountMessage" class="notice"></p></article>
          <article class="account-card"><h3>Preferencias</h3><p>Avisos del negocio.</p><div class="account-fields"><label>Pedidos<select id="prefOrders"><option>Email y WhatsApp</option><option>Solo email</option><option>Solo WhatsApp</option></select></label><label>Productos consultados<select id="prefStock"><option>Activado</option><option>Desactivado</option></select></label><label class="wide">Firma del panel<input value="ITHIEL Bazar y Makeup" readonly></label></div></article>
          <article class="account-card"><h3>Actividad reciente</h3><p>Movimientos de la cuenta.</p><table><tbody><tr><td>Ingreso al panel</td><td><span class="pill">Correcto</span></td></tr><tr><td>Cuenta</td><td>${escapeHtml(user?.email || "")}</td></tr></tbody></table></article>
          <article class="account-card" style="grid-column:1/-1"><h3>Últimos pedidos</h3><p>Seguimiento rápido.</p>${recentOrders.length?`<table><thead><tr><th>Pedido</th><th>Clienta</th><th>Total</th><th>Estado</th></tr></thead><tbody>${recentOrders.map(order=>`<tr><td>#${escapeHtml(order.order_number)}</td><td>${escapeHtml(order.customers?.full_name||"Sin registro")}</td><td>${money(order.total)}</td><td>${statusLabel(order.status)}</td></tr>`).join("")}</tbody></table>`:'<p class="empty">Todavía no hay pedidos registrados.</p>'}</article>
        </section>`;
      document.querySelector("#accountProfileForm").addEventListener("submit",async(event)=>{event.preventDefault();const message=document.querySelector("#profileMessage");message.className="notice is-muted";message.textContent="Guardando…";const {error}=await supabase.auth.updateUser({data:{full_name:document.querySelector("#accountName").value.trim(),phone:document.querySelector("#accountPhone").value.trim()}});if(error){message.className="notice is-error";message.textContent=error.message;return}message.className="notice is-success";message.textContent="Perfil actualizado."});
      document.querySelector("#sendPasswordReset").addEventListener("click",async()=>{const message=document.querySelector("#adminAccountMessage");message.className="notice is-muted";message.textContent="Enviando email…";const {error}=await supabase.auth.resetPasswordForEmail(user.email,{redirectTo:`${window.location.origin}/cuenta`});if(error){message.className="notice is-error";message.textContent=error.message;return}message.className="notice is-success";message.textContent="Te enviamos un email para cambiar tu contraseña."});
    }

    async function loadView(view) {
      currentView = view;
      sessionStorage.setItem("ithiel-admin-view", view);
      document.querySelectorAll(".nav button").forEach(button => button.classList.toggle("active", button.dataset.view === view));
      setLoading();
      try {
        if (view === "account") { await renderAccount(); return; }
        const data = await callAdmin(view === "catalog" ? "catalogManagement" : view);
        if (view === "dashboard") renderDashboard(data);
        if (view === "products") renderProducts(data);
        if (view === "orders") renderOrders(data);
        if (view === "customers") renderCustomers(data);
        if (view === "admins") renderAdmins(data);
        if (view === "catalog") renderCatalog(data);
        if (view === "coupons") renderCoupons(data);
        if (view === "experiences") renderExperiences(data);
      } catch (error) {
        content.innerHTML = `<p class="empty">${escapeHtml(error.message)}</p>`;
      }
    }

    async function showApp(session) {
      document.querySelector("#accountEmail").textContent = session.user.email || "Cuenta administradora";
      loginView.classList.add("hidden");
      appView.classList.remove("hidden");
      if (appReady) return;
      appReady = true;
      await loadView(currentView);
    }

    function setup() {
      if (SUPABASE_ANON_KEY.startsWith("PEGAR_AQUI")) {
        setNotice("Falta configurar la clave pública de Supabase.");
        return;
      }
      supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      supabase.auth.getSession().then(({ data: { session } }) => { if (session) showApp(session); });
      supabase.auth.onAuthStateChange((event, session) => {
        if (event === "SIGNED_OUT") { appReady = false; return; }
        if (session && !appReady) showApp(session);
      });
    }

    document.querySelector("#loginForm").addEventListener("submit", async (event) => {
      event.preventDefault(); setNotice("");
      const email = document.querySelector("#email").value.trim();
      const password = document.querySelector("#password").value;
      const { error } = await supabase.auth.signInWithPassword({ email, password });
      if (error) setNotice("No se pudo ingresar. Revisá email y contraseña.");
    });
    document.querySelector("#googleLogin").addEventListener("click", async () => {
      setNotice("");
      const { error } = await supabase.auth.signInWithOAuth({ provider:"google", options:{ redirectTo:`${window.location.origin}/admin.html` } });
      if (error) setNotice("No se pudo iniciar con Google.");
    });
    document.querySelector("#logout").addEventListener("click", () => supabase.auth.signOut().then(() => location.reload()));
    document.querySelectorAll(".nav button").forEach(button => button.addEventListener("click", () => loadView(button.dataset.view)));
    setup();
  </script>
</body>
</html>
